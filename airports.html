<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport Database Manager</title>
    <style>
        /* --- CSS STYLES --- */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; }
        h1 { margin: 0 0 10px 0; color: #2c3e50; }
        
        /* Grid Layout */
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        /* Cards */
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }

        /* Forms */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        
        /* Buttons */
        button { cursor: pointer; border: none; border-radius: 4px; padding: 10px 15px; font-size: 1rem; transition: background 0.2s; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-success { background-color: #27ae60; color: white; width: 100%; font-weight: bold; }
        .btn-success:hover { background-color: #219150; }
        .btn-danger { background-color: #e74c3c; color: white; font-size: 0.8rem; padding: 5px 10px; }
        
        /* Feedback Messages */
        #message-area { text-align: center; margin-bottom: 20px; padding: 10px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }

        /* Gallery */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; max-height: 600px; overflow-y: auto; }
        .img-card { border: 1px solid #eee; border-radius: 6px; overflow: hidden; background: #fff; }
        .img-thumb { width: 100%; height: 100px; object-fit: cover; background: #000; display: block; }
        .img-meta { padding: 10px; font-size: 0.85rem; }
        .img-meta strong { display: block; margin-bottom: 4px; }
        .img-actions { margin-top: 8px; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✈️ Airport Database Manager</h1>
        <p>Search, View, and Upload Airport Images (S3)</p>
    </header>

    <div id="message-area"></div>

    <div class="grid">
        <div class="card">
            <h2>🔍 Browser</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="text" id="searchIcao" placeholder="Enter ICAO (e.g., KJFK)" maxlength="4" style="text-transform: uppercase;">
                <button class="btn-primary" onclick="searchImages()">Search</button>
            </div>
            
            <div id="gallery" class="gallery">
                <p style="text-align: center; color: #888; grid-column: 1/-1;">Enter an ICAO code to view images.</p>
            </div>
        </div>

        <div class="card">
            <h2>📤 Upload New</h2>
            <form id="uploadForm" onsubmit="handleUpload(event)">
                <div class="form-group">
                    <label>Airport ICAO</label>
                    <input type="text" id="upIcao" placeholder="KJFK" required maxlength="4" style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label>Contributor Name</label>
                    <input type="text" id="upContributor" placeholder="Pilot Name" required>
                </div>
                <div class="form-group">
                    <label>Image File</label>
                    <input type="file" id="upFile" accept="image/*" required>
                </div>
                <button type="submit" class="btn-success" id="uploadBtn">Upload Image</button>
            </form>
        </div>
    </div>
</div>

<script>
    // --- JAVASCRIPT LOGIC ---

    // Show feedback messages
    function showMessage(text, type) {
        const msgBox = document.getElementById('message-area');
        msgBox.textContent = text;
        msgBox.className = type; // 'success' or 'error'
        msgBox.style.display = 'block';
        setTimeout(() => { msgBox.style.display = 'none'; }, 4000);
    }

    // 1. Search Images
    async function searchImages() {
        const icao = document.getElementById('searchIcao').value.trim().toUpperCase();
        if (!icao) return;

        // Auto-fill the upload box for convenience
        document.getElementById('upIcao').value = icao;

        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Loading...</p>';

        try {
            const res = await fetch(`/api/airports/${icao}`);
            const data = await res.json();

            gallery.innerHTML = ''; // Clear loading

            if (data.length === 0) {
                gallery.innerHTML = `<p style="text-align:center; color:#888; grid-column: 1/-1;">No images found for ${icao}</p>`;
                return;
            }

            // Render Images
            data.forEach(img => {
                const dateStr = new Date(img.uploadedAt).toLocaleDateString();
                const item = document.createElement('div');
                item.className = 'img-card';
                item.innerHTML = `
                    <a href="${img.url}" target="_blank">
                        <img src="${img.url}" class="img-thumb" alt="${img.icao}">
                    </a>
                    <div class="img-meta">
                        <strong>${img.contributorName}</strong>
                        <span>${dateStr}</span>
                        <div class="img-actions">
                            <button class="btn-danger" onclick="deleteImage('${img.url}', '${icao}')">Delete</button>
                        </div>
                    </div>
                `;
                gallery.appendChild(item);
            });

        } catch (err) {
            console.error(err);
            showMessage('Error fetching images', 'error');
        }
    }

    // 2. Upload Image
    async function handleUpload(e) {
        e.preventDefault();
        const btn = document.getElementById('uploadBtn');
        const icao = document.getElementById('upIcao').value.trim().toUpperCase();
        const contributor = document.getElementById('upContributor').value.trim();
        const fileInput = document.getElementById('upFile');
        const file = fileInput.files[0];

        if(!file) return;

        // Prepare Form Data
        const formData = new FormData();
        formData.append('icao', icao);
        formData.append('contributorName', contributor);
        formData.append('image', file);

        btn.disabled = true;
        btn.textContent = 'Uploading...';

        try {
            const res = await fetch('/api/airports', {
                method: 'POST',
                body: formData
            });

            if (!res.ok) throw new Error('Upload failed');

            showMessage('Image uploaded successfully!', 'success');
            
            // Clear file input
            fileInput.value = '';
            
            // Refresh gallery if we are looking at that airport
            const currentSearch = document.getElementById('searchIcao').value.trim().toUpperCase();
            if (currentSearch === icao) {
                searchImages();
            }

        } catch (err) {
            console.error(err);
            showMessage('Upload failed. Check console.', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Upload Image';
        }
    }

    // 3. Delete Image
    async function deleteImage(imageUrl, currentIcao) {
        if (!confirm('Are you sure you want to delete this image?')) return;

        try {
            const res = await fetch('/api/airports', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ imageUrl })
            });

            if (!res.ok) throw new Error('Delete failed');

            showMessage('Image deleted.', 'success');
            
            // Refresh the list
            searchImages();

        } catch (err) {
            console.error(err);
            showMessage('Failed to delete image.', 'error');
        }
    }
</script>

</body>
</html>
