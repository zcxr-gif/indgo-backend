<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VA Ads Manager</title>
    <script>
        // Staff session guard: if any API call comes back 401 (session expired),
        // bounce to the portal login, preserving where we were.
        (function () {
            const _fetch = window.fetch;
            window.fetch = async function (...args) {
                const res = await _fetch.apply(this, args);
                if (res.status === 401) {
                    location.href = '/staff?next=' + encodeURIComponent(location.pathname + location.search);
                }
                return res;
            };
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 950: '#020617' } } } }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .loader { border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-scroll::-webkit-scrollbar { width: 8px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen">

    <!-- Navigation -->
    <nav class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                    <i class="fa-solid fa-bullhorn text-lg"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight hidden sm:block">VA Ads Manager</h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleDarkMode()" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
                    <i id="themeIcon" class="fa-solid fa-moon text-slate-600 dark:text-yellow-400 text-lg"></i>
                </button>
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2 transition-all active:scale-95 shadow-lg shadow-blue-600/20">
                    <i class="fa-solid fa-plus text-sm"></i><span>Add VA</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header + stats -->
        <section class="mb-8">
            <h2 class="text-3xl sm:text-4xl font-extrabold mb-2 bg-gradient-to-r from-blue-600 to-indigo-500 bg-clip-text text-transparent">Virtual Airline Advertisements</h2>
            <p class="text-slate-500 dark:text-slate-400 font-medium" id="countLabel">Loading…</p>
        </section>

        <!-- Filters -->
        <section class="mb-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <div class="relative sm:col-span-2 lg:col-span-1">
                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input id="searchInput" oninput="debouncedLoad()" placeholder="Search name, tags…" class="w-full pl-10 pr-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none transition-all font-medium">
            </div>
            <select id="statusFilter" onchange="loadAds()" class="px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none font-medium">
                <option value="all">All statuses</option>
                <option value="approved">Live (approved)</option>
                <option value="pending">Draft (pending)</option>
                <option value="rejected">Archived (rejected)</option>
            </select>
            <select id="typeFilter" onchange="loadAds()" class="px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none font-medium">
                <option value="">All types</option>
                <option value="VA">Virtual Airline (VA)</option>
                <option value="VO">Virtual Organization (VO)</option>
            </select>
            <select id="sortFilter" onchange="loadAds()" class="px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none font-medium">
                <option value="">Featured first</option>
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="popular">Most viewed</option>
                <option value="name">Name (A–Z)</option>
            </select>
        </section>

        <!-- Grid -->
        <section id="grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></section>

        <!-- Empty / loading states -->
        <div id="emptyState" class="hidden text-center py-24">
            <i class="fa-solid fa-plane-slash text-5xl text-slate-300 dark:text-slate-700 mb-4"></i>
            <p class="text-slate-500 dark:text-slate-400 font-medium">No advertisements found. Click “Add VA” to create one.</p>
        </div>
        <div id="loadingState" class="text-center py-24">
            <div class="loader mx-auto border-blue-500/30 border-t-blue-500"></div>
        </div>
    </main>

    <!-- ===================== MODAL ===================== -->
    <div id="modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-start sm:items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white dark:bg-slate-900 rounded-3xl w-full max-w-2xl my-8 shadow-2xl border border-slate-200 dark:border-slate-800 animate-fade-in-up">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-800 sticky top-0 bg-white dark:bg-slate-900 rounded-t-3xl z-10">
                <h3 id="modalTitle" class="text-lg font-bold">Add VA Advertisement</h3>
                <button onclick="closeModal()" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="adForm" onsubmit="submitForm(event)" class="px-6 py-5 space-y-5 max-h-[70vh] overflow-y-auto modal-scroll">
                <input type="hidden" id="editId">

                <!-- Images -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-semibold mb-1.5">Banner</label>
                        <div class="relative aspect-[8/3] rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 overflow-hidden bg-slate-50 dark:bg-slate-800/50 flex items-center justify-center">
                            <img id="bannerPreview" class="hidden absolute inset-0 w-full h-full object-cover">
                            <span id="bannerPlaceholder" class="text-slate-400 text-sm"><i class="fa-solid fa-image mr-1"></i>Banner image</span>
                            <input type="file" id="bannerInput" accept="image/*" onchange="previewImage(this,'bannerPreview','bannerPlaceholder')" class="absolute inset-0 opacity-0 cursor-pointer">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1.5">Logo</label>
                        <div class="relative aspect-square rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 overflow-hidden bg-slate-50 dark:bg-slate-800/50 flex items-center justify-center">
                            <img id="logoPreview" class="hidden absolute inset-0 w-full h-full object-contain">
                            <span id="logoPlaceholder" class="text-slate-400 text-xs text-center px-2"><i class="fa-solid fa-image"></i></span>
                            <input type="file" id="logoInput" accept="image/*" onchange="previewImage(this,'logoPreview','logoPlaceholder')" class="absolute inset-0 opacity-0 cursor-pointer">
                        </div>
                    </div>
                </div>

                <!-- Identity -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-semibold mb-1.5">VA Name <span class="text-red-500">*</span></label>
                        <input id="f_name" required class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1.5">Callsign <span class="font-normal text-slate-400">— base only, pilots fly as "NAME ##VA"</span></label>
                        <input id="f_callsign" placeholder="e.g. Ocean → OCEAN ##VA" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none uppercase">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1.5">Tagline</label>
                    <input id="f_tagline" maxlength="140" placeholder="One-line hook (max 140 chars)" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1.5">Description</label>
                    <textarea id="f_description" rows="3" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none resize-y"></textarea>
                </div>

                <!-- Type / region / pilots / grade -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1.5">Type</label>
                        <select id="f_type" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none">
                            <option value="VA">VA</option>
                            <option value="VO">VO</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1.5">Region</label>
                        <input id="f_region" value="Global" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1.5">Pilots</label>
                        <input id="f_pilotCount" type="number" min="0" value="0" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1.5">Min Grade</label>
                        <input id="f_minGrade" type="number" min="1" max="5" placeholder="1–5" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none">
                    </div>
                </div>

                <!-- Hubs / fleet / tags -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1.5">Hubs <span class="text-slate-400 font-normal">(comma sep.)</span></label>
                        <input id="f_hubs" placeholder="VABB, VIDP" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none uppercase">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1.5">Fleet <span class="text-slate-400 font-normal">(comma sep.)</span></label>
                        <input id="f_fleet" placeholder="A320, B777" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1.5">Tags <span class="text-slate-400 font-normal">(comma sep.)</span></label>
                        <input id="f_tags" placeholder="realistic, events" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1.5">Joining Requirements</label>
                    <textarea id="f_requirements" rows="2" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none resize-y"></textarea>
                </div>

                <!-- Links -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1.5"><i class="fa-solid fa-globe text-slate-400 mr-1"></i>Website</label>
                        <input id="f_websiteUrl" type="url" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1.5"><i class="fa-brands fa-discord text-slate-400 mr-1"></i>Discord Invite</label>
                        <input id="f_discordUrl" type="url" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1.5"><i class="fa-solid fa-comments text-slate-400 mr-1"></i>IFC Thread</label>
                        <input id="f_ifcThreadUrl" type="url" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1.5"><i class="fa-solid fa-paper-plane text-slate-400 mr-1"></i>Application Link</label>
                        <input id="f_applicationUrl" type="url" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none">
                    </div>
                </div>

                <!-- Owner / contact -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1.5">Owner / Contact Name</label>
                        <input id="f_ownerName" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1.5">Contact Email</label>
                        <input id="f_contactEmail" type="email" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none">
                    </div>
                </div>

                <!-- Status / toggles -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                    <div>
                        <label class="block text-sm font-semibold mb-1.5">Status</label>
                        <select id="f_status" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 outline-none">
                            <option value="approved">Live (approved)</option>
                            <option value="pending">Draft (pending)</option>
                            <option value="rejected">Archived (rejected)</option>
                        </select>
                    </div>
                    <label class="flex items-center gap-2 py-2.5 cursor-pointer">
                        <input type="checkbox" id="f_recruiting" checked class="w-5 h-5 rounded accent-blue-600">
                        <span class="text-sm font-semibold">Recruiting</span>
                    </label>
                    <label class="flex items-center gap-2 py-2.5 cursor-pointer">
                        <input type="checkbox" id="f_featured" class="w-5 h-5 rounded accent-amber-500">
                        <span class="text-sm font-semibold">Featured</span>
                    </label>
                </div>
            </form>

            <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-slate-200 dark:border-slate-800">
                <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl font-medium hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">Cancel</button>
                <button onclick="submitForm(event)" id="saveBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-semibold flex items-center gap-2 transition-all active:scale-95 shadow-lg shadow-blue-600/20">
                    <span id="saveBtnText">Save</span>
                    <div id="saveLoader" class="loader hidden"></div>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-6 right-6 z-[60] px-5 py-3 rounded-xl shadow-2xl font-medium text-white animate-fade-in-up"></div>

    <script>
        const API = "/api/va-ads";
        let debounceTimer;

        // ---------- Theme ----------
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const dark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', dark ? 'dark' : 'light');
            document.getElementById('themeIcon').className = dark ? 'fa-solid fa-sun text-yellow-400 text-lg' : 'fa-solid fa-moon text-slate-600 text-lg';
        }
        (function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun text-yellow-400 text-lg';
            }
        })();

        // ---------- Toast ----------
        function toast(msg, ok = true) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `fixed bottom-6 right-6 z-[60] px-5 py-3 rounded-xl shadow-2xl font-medium text-white animate-fade-in-up ${ok ? 'bg-emerald-600' : 'bg-red-600'}`;
            t.classList.remove('hidden');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.add('hidden'), 3200);
        }

        // ---------- Helpers ----------
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        // Render the stored base radio callsign in Infinite Flight VA format,
        // e.g. "OCEAN" -> "OCEAN ##VA" (pilots substitute their pilot number).
        const fmtCallsign = (base) => {
            if (!base) return '';
            const clean = String(base).trim().toUpperCase().replace(/\s*#+\s*VA$/i, '').replace(/\s+VA$/i, '').trim();
            return clean ? clean + ' ##VA' : '';
        };
        const statusBadge = (s) => {
            const map = { approved: ['Live','bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300'],
                          pending: ['Draft','bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300'],
                          rejected: ['Archived','bg-slate-200 text-slate-600 dark:bg-slate-800 dark:text-slate-400'] };
            const [label, cls] = map[s] || map.pending;
            return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold ${cls}">${label}</span>`;
        };

        // ---------- Load list ----------
        function debouncedLoad() { clearTimeout(debounceTimer); debounceTimer = setTimeout(loadAds, 350); }

        async function loadAds() {
            const grid = document.getElementById('grid');
            const loading = document.getElementById('loadingState');
            const empty = document.getElementById('emptyState');
            loading.classList.remove('hidden'); empty.classList.add('hidden');

            const params = new URLSearchParams({ limit: '100' });
            params.set('status', document.getElementById('statusFilter').value);
            const type = document.getElementById('typeFilter').value;
            const sort = document.getElementById('sortFilter').value;
            const search = document.getElementById('searchInput').value.trim();
            if (type) params.set('type', type);
            if (sort) params.set('sort', sort);
            if (search) params.set('search', search);

            try {
                const res = await fetch(`${API}?${params}`);
                const json = await res.json();
                const ads = json.data || [];
                loading.classList.add('hidden');
                document.getElementById('countLabel').textContent = `${json.pagination?.total ?? ads.length} advertisement(s)`;

                if (!ads.length) { grid.innerHTML = ''; empty.classList.remove('hidden'); return; }
                grid.innerHTML = ads.map(cardHtml).join('');
            } catch (e) {
                loading.classList.add('hidden');
                toast('Failed to load advertisements.', false);
            }
        }

        function cardHtml(ad) {
            const banner = ad.bannerUrl
                ? `<img src="${esc(ad.bannerUrl)}" class="w-full h-full object-cover">`
                : `<div class="w-full h-full flex items-center justify-center text-slate-300 dark:text-slate-700"><i class="fa-solid fa-plane text-4xl"></i></div>`;
            const logo = ad.logoUrl ? `<img src="${esc(ad.logoUrl)}" class="w-12 h-12 rounded-lg object-contain bg-white border border-slate-200 dark:border-slate-700 shadow -mt-8 relative z-10">` : '';
            const star = ad.featured ? '<i class="fa-solid fa-star text-amber-400" title="Featured"></i>' : '';
            return `
            <div class="bg-white dark:bg-slate-900/60 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden flex flex-col animate-fade-in-up">
                <div class="relative aspect-[8/3] bg-slate-100 dark:bg-slate-800">
                    ${banner}
                    <div class="absolute top-2 right-2 flex items-center gap-2">${star}${statusBadge(ad.status)}</div>
                </div>
                <div class="p-4 flex flex-col flex-1">
                    <div class="flex items-start gap-3">
                        ${logo}
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold truncate">${esc(ad.name)}</h3>
                                <span class="text-xs px-1.5 py-0.5 rounded bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300 font-semibold shrink-0">${esc(ad.type)}</span>
                            </div>
                            <p class="text-xs text-slate-500 dark:text-slate-400 truncate">${ad.callsign ? esc(fmtCallsign(ad.callsign)) + ' · ' : ''}${esc(ad.region || 'Global')}</p>
                        </div>
                    </div>
                    ${ad.tagline ? `<p class="text-sm text-slate-600 dark:text-slate-300 mt-3 line-clamp-2">${esc(ad.tagline)}</p>` : ''}
                    <div class="flex flex-wrap gap-x-4 gap-y-1 mt-3 text-xs text-slate-500 dark:text-slate-400">
                        <span><i class="fa-solid fa-users mr-1"></i>${ad.pilotCount ?? 0} pilots</span>
                        <span><i class="fa-solid fa-eye mr-1"></i>${ad.views ?? 0}</span>
                        <span><i class="fa-solid fa-arrow-pointer mr-1"></i>${ad.clicks ?? 0}</span>
                        <span class="${ad.recruiting ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400'}"><i class="fa-solid fa-${ad.recruiting ? 'door-open' : 'door-closed'} mr-1"></i>${ad.recruiting ? 'Recruiting' : 'Closed'}</span>
                    </div>
                    <div class="flex items-center gap-2 mt-4 pt-3 border-t border-slate-100 dark:border-slate-800">
                        <button onclick='openModal(${JSON.stringify(ad).replace(/'/g, "&#39;")})' class="flex-1 text-sm font-medium py-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"><i class="fa-solid fa-pen mr-1"></i>Edit</button>
                        <button onclick="toggleFeature('${ad._id}')" class="px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-amber-100 dark:hover:bg-amber-900/40 transition-colors" title="Toggle featured"><i class="fa-${ad.featured ? 'solid' : 'regular'} fa-star ${ad.featured ? 'text-amber-400' : ''}"></i></button>
                        <button onclick="removeAd('${ad._id}','${esc(ad.name)}')" class="px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-red-100 dark:hover:bg-red-900/40 hover:text-red-600 transition-colors" title="Delete"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            </div>`;
        }

        // ---------- Modal ----------
        function openModal(ad = null) {
            document.getElementById('adForm').reset();
            document.getElementById('bannerPreview').classList.add('hidden');
            document.getElementById('logoPreview').classList.add('hidden');
            document.getElementById('bannerPlaceholder').classList.remove('hidden');
            document.getElementById('logoPlaceholder').classList.remove('hidden');
            document.getElementById('editId').value = '';

            if (ad) {
                document.getElementById('modalTitle').textContent = 'Edit Advertisement';
                document.getElementById('editId').value = ad._id;
                const set = (id, v) => document.getElementById(id).value = v ?? '';
                set('f_name', ad.name); set('f_callsign', ad.callsign); set('f_tagline', ad.tagline);
                set('f_description', ad.description); set('f_region', ad.region); set('f_pilotCount', ad.pilotCount ?? 0);
                set('f_minGrade', ad.minGrade); set('f_requirements', ad.requirements);
                set('f_hubs', (ad.hubs || []).join(', ')); set('f_fleet', (ad.fleet || []).join(', ')); set('f_tags', (ad.tags || []).join(', '));
                set('f_websiteUrl', ad.websiteUrl); set('f_discordUrl', ad.discordUrl); set('f_ifcThreadUrl', ad.ifcThreadUrl); set('f_applicationUrl', ad.applicationUrl);
                set('f_ownerName', ad.ownerName); set('f_contactEmail', ad.contactEmail);
                document.getElementById('f_type').value = ad.type || 'VA';
                document.getElementById('f_status').value = ad.status || 'approved';
                document.getElementById('f_recruiting').checked = !!ad.recruiting;
                document.getElementById('f_featured').checked = !!ad.featured;
                if (ad.bannerUrl) showPreview('bannerPreview','bannerPlaceholder', ad.bannerUrl);
                if (ad.logoUrl) showPreview('logoPreview','logoPlaceholder', ad.logoUrl);
            } else {
                document.getElementById('modalTitle').textContent = 'Add VA Advertisement';
                document.getElementById('f_region').value = 'Global';
                document.getElementById('f_pilotCount').value = 0;
                document.getElementById('f_recruiting').checked = true;
                document.getElementById('f_status').value = 'approved';
            }
            document.getElementById('modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); document.body.style.overflow = ''; }

        function previewImage(input, imgId, phId) {
            const file = input.files[0];
            if (!file) return;
            showPreview(imgId, phId, URL.createObjectURL(file));
        }
        function showPreview(imgId, phId, src) {
            const img = document.getElementById(imgId);
            img.src = src; img.classList.remove('hidden');
            document.getElementById(phId).classList.add('hidden');
        }

        // ---------- Submit ----------
        async function submitForm(e) {
            e.preventDefault();
            const form = document.getElementById('adForm');
            if (!form.checkValidity()) { form.reportValidity(); return; }

            const id = document.getElementById('editId').value;
            const fd = new FormData();
            const add = (k, v) => { if (v !== '' && v !== null && v !== undefined) fd.append(k, v); };
            const val = (id) => document.getElementById(id).value.trim();

            add('name', val('f_name')); add('callsign', val('f_callsign')); add('type', document.getElementById('f_type').value);
            add('tagline', val('f_tagline')); add('description', val('f_description'));
            add('region', val('f_region')); add('pilotCount', val('f_pilotCount')); add('minGrade', val('f_minGrade'));
            add('requirements', val('f_requirements')); add('hubs', val('f_hubs')); add('fleet', val('f_fleet')); add('tags', val('f_tags'));
            add('websiteUrl', val('f_websiteUrl')); add('discordUrl', val('f_discordUrl')); add('ifcThreadUrl', val('f_ifcThreadUrl')); add('applicationUrl', val('f_applicationUrl'));
            add('ownerName', val('f_ownerName')); add('contactEmail', val('f_contactEmail'));
            add('status', document.getElementById('f_status').value);
            fd.append('recruiting', document.getElementById('f_recruiting').checked);
            fd.append('featured', document.getElementById('f_featured').checked);
            const banner = document.getElementById('bannerInput').files[0];
            const logo = document.getElementById('logoInput').files[0];
            if (banner) fd.append('banner', banner);
            if (logo) fd.append('logo', logo);

            const btn = document.getElementById('saveBtn');
            document.getElementById('saveLoader').classList.remove('hidden');
            document.getElementById('saveBtnText').textContent = 'Saving';
            btn.disabled = true;

            try {
                const res = await fetch(id ? `${API}/${id}` : API, { method: id ? 'PUT' : 'POST', body: fd });
                const json = await res.json();
                if (!res.ok) throw new Error(json.message || 'Request failed');
                toast(json.message || 'Saved.');
                closeModal();
                loadAds();
            } catch (err) {
                toast(err.message, false);
            } finally {
                document.getElementById('saveLoader').classList.add('hidden');
                document.getElementById('saveBtnText').textContent = 'Save';
                btn.disabled = false;
            }
        }

        async function toggleFeature(id) {
            try {
                const res = await fetch(`${API}/${id}/feature`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: '{}' });
                const json = await res.json();
                if (!res.ok) throw new Error(json.message);
                toast(json.message);
                loadAds();
            } catch (e) { toast(e.message || 'Failed to toggle featured.', false); }
        }

        async function removeAd(id, name) {
            if (!confirm(`Delete “${name}”? This also removes its banner and logo. This cannot be undone.`)) return;
            try {
                const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
                const json = await res.json();
                if (!res.ok) throw new Error(json.message);
                toast('Advertisement deleted.');
                loadAds();
            } catch (e) { toast(e.message || 'Failed to delete.', false); }
        }

        // ---------- Init ----------
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
        loadAds();
    </script>
</body>
</html>
