<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroGallery | Advanced Fleet & Airport Database</title>
    
    <!-- Tailwind CSS with Dark Mode Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#151f32',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Babel for React -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Import Map for React & Icons -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0"
      }
    }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        /* Smooth Fade In */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          Plane, Upload, Search, X, Info, Camera, User, Tag, Hash, Trash2,
          AlertCircle, CheckCircle2, Loader2, Edit, Pencil, Moon, Sun,
          Filter, SlidersHorizontal, Settings, Shield, BarChart3, ChevronDown,
          Database, Cloud, Server, HardDrive, LayoutGrid, ListChecks, Building2, MapPin, Plus
        } from 'lucide-react';

        const IS_LOCALHOST = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

        const API_BASE = IS_LOCALHOST ? 'http://localhost:5000/api' : '/api';
        const API_URL = `${API_BASE}/aircraft`;
        const STATS_URL = `${API_BASE}/admin/stats`;
        const AIRPORT_API = `${API_BASE}/airports`;

        // --- UTILS ---
        function formatBytes(bytes, decimals = 1) {
            if (!+bytes) return '0 B';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        function App() {
          // --- GLOBAL STATE ---
          const [aircrafts, setAircrafts] = useState([]);
          const [stats, setStats] = useState(null);
          const [loading, setLoading] = useState(true);
          const [isDemoMode, setIsDemoMode] = useState(false);
          const [theme, setTheme] = useState('light');
          
          // --- VIEW STATE ---
          const [currentView, setCurrentView] = useState('gallery'); // 'gallery', 'collection', 'airports'

          // --- FILTER & SEARCH STATE ---
          const [searchTerm, setSearchTerm] = useState('');
          const [filterType, setFilterType] = useState('All');
          const [filterContributor, setFilterContributor] = useState('All');
          const [sortBy, setSortBy] = useState('newest');

          // --- ADMIN / UI STATE ---
          const [adminMode, setAdminMode] = useState(true);
          const [showFormModal, setShowFormModal] = useState(false);
          const [editingAircraft, setEditingAircraft] = useState(null);
          const [selectedAircraft, setSelectedAircraft] = useState(null);
          const [prefillData, setPrefillData] = useState(null);

          // --- INITIALIZATION ---
          useEffect(() => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                setTheme(savedTheme);
                document.documentElement.classList.toggle('dark', savedTheme === 'dark');
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme('dark');
                document.documentElement.classList.add('dark');
            }
            fetchAircraft();
            fetchStats();
          }, []);

          const toggleTheme = () => {
              const newTheme = theme === 'light' ? 'dark' : 'light';
              setTheme(newTheme);
              localStorage.setItem('theme', newTheme);
              document.documentElement.classList.toggle('dark');
          };

          const fetchStats = async () => {
              try {
                  const res = await fetch(STATS_URL);
                  if (res.ok) setStats(await res.json());
              } catch (err) { console.warn("Stats service unavailable"); }
          };

          const fetchAircraft = async () => {
            setLoading(true);
            try {
              const response = await fetch(API_URL);
              if (!response.ok) throw new Error('Failed to connect');
              setAircrafts(await response.json());
              setIsDemoMode(false);
            } catch (error) {
              setIsDemoMode(true);
            } finally { setLoading(false); }
          };

          const uniqueTypes = useMemo(() => ['All', ...new Set(aircrafts.map(a => a.aircraftType).filter(Boolean).sort())], [aircrafts]);
          const uniqueContributors = useMemo(() => ['All', ...new Set(aircrafts.map(a => a.contributorName).filter(Boolean).sort())], [aircrafts]);

          const filteredAndSortedAircraft = useMemo(() => {
              let result = [...aircrafts];
              if (searchTerm) {
                  const lower = searchTerm.toLowerCase();
                  result = result.filter(ac => 
                    ac.tailNumber.toLowerCase().includes(lower) ||
                    ac.aircraftType.toLowerCase().includes(lower) ||
                    ac.liveryName.toLowerCase().includes(lower)
                  );
              }
              if (filterType !== 'All') result = result.filter(ac => ac.aircraftType === filterType);
              if (filterContributor !== 'All') result = result.filter(ac => ac.contributorName === filterContributor);
              result.sort((a, b) => {
                  if (sortBy === 'newest') return new Date(b.uploadedAt) - new Date(a.uploadedAt);
                  if (sortBy === 'oldest') return new Date(a.uploadedAt) - new Date(b.uploadedAt);
                  if (sortBy === 'az') return a.tailNumber.localeCompare(b.tailNumber);
                  return 0;
              });
              return result;
          }, [aircrafts, searchTerm, filterType, filterContributor, sortBy]);

          const handleDelete = async (id, e) => {
            if(e) e.stopPropagation();
            if (!confirm('Are you sure you want to delete this aircraft?')) return;
            try {
              await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
              fetchAircraft();
              fetchStats();
              if (selectedAircraft?._id === id) setSelectedAircraft(null);
            } catch (error) { alert('Error deleting aircraft'); }
          };

          return (
            <div className="min-h-screen flex flex-col font-sans selection:bg-blue-200 dark:selection:bg-blue-900">
              
              <nav className="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex items-center justify-between h-16">
                    
                    <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentView('gallery')}>
                        <div className="bg-gradient-to-br from-blue-600 to-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-blue-500/20">
                            <Plane size={20} fill="currentColor" className="transform -rotate-45" />
                        </div>
                        <div className="hidden sm:block">
                            <h1 className="text-lg font-bold tracking-tight text-slate-900 dark:text-white">AeroGallery</h1>
                            <p className="text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 tracking-wider">Fleet Database</p>
                        </div>
                    </div>

                    <div className="hidden md:flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-lg">
                        <button onClick={() => setCurrentView('gallery')} className={`flex items-center gap-2 px-3 py-1.5 text-xs font-bold uppercase tracking-wide rounded-md transition-all ${currentView === 'gallery' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>
                            <LayoutGrid size={14} /> Gallery
                        </button>
                        <button onClick={() => setCurrentView('collection')} className={`flex items-center gap-2 px-3 py-1.5 text-xs font-bold uppercase tracking-wide rounded-md transition-all ${currentView === 'collection' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>
                            <ListChecks size={14} /> Checklist
                        </button>
                        <button onClick={() => setCurrentView('airports')} className={`flex items-center gap-2 px-3 py-1.5 text-xs font-bold uppercase tracking-wide rounded-md transition-all ${currentView === 'airports' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>
                            <Building2 size={14} /> Airports
                        </button>
                    </div>

                    <div className="flex items-center gap-2 sm:gap-3">
                        <button onClick={toggleTheme} className="p-2 text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 rounded-lg transition-colors">
                            {theme === 'light' ? <Moon size={20}/> : <Sun size={20}/>}
                        </button>
                        <button onClick={() => { setEditingAircraft(null); setPrefillData(null); setShowFormModal(true); }} className="hidden sm:flex items-center gap-2 bg-slate-900 dark:bg-blue-600 hover:bg-slate-800 dark:hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-all shadow-lg active:scale-95">
                            <Upload size={16} /> <span>Upload</span>
                        </button>
                    </div>
                  </div>
                </div>
              </nav>

              {currentView === 'gallery' ? (
                  <>
                  <div className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
                      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                              <div className="flex flex-wrap items-center gap-4 text-sm text-slate-500">
                                    <div className="flex items-center gap-2">
                                        <BarChart3 size={16} />
                                        <span className="font-medium text-slate-900 dark:text-white">{aircrafts.length}</span> <span className="hidden sm:inline">Aircraft</span>
                                    </div>
                                    {stats && (
                                        <>
                                            <div className="hidden lg:flex h-4 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>
                                            <div className="flex items-center gap-2"><Cloud size={16} className="text-blue-500" />{formatBytes(stats.s3SizeBytes)}</div>
                                            <div className="flex items-center gap-2"><Database size={16} className="text-indigo-500" />{formatBytes(stats.dbSizeBytes)}</div>
                                        </>
                                    )}
                              </div>
                              <div className="flex flex-wrap items-center gap-3">
                                  <div className="hidden md:flex relative max-w-[200px]">
                                        <input type="text" className="w-full pl-3 pr-8 py-1.5 border dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-800 text-sm outline-none" placeholder="Quick search..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                                        <Search size={14} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400" />
                                  </div>
                                  <div className="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0 scrollbar-hide">
                                    <FilterSelect label="Type" options={uniqueTypes} value={filterType} onChange={(e) => setFilterType(e.target.value)} />
                                    <FilterSelect label="Contributor" options={uniqueContributors} value={filterContributor} onChange={(e) => setFilterContributor(e.target.value)} />
                                    <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-transparent text-sm font-medium border-none focus:ring-0 cursor-pointer text-slate-700 dark:text-slate-300">
                                        <option value="newest">Newest First</option>
                                        <option value="oldest">Oldest First</option>
                                        <option value="az">A-Z (Tail)</option>
                                    </select>
                                  </div>
                              </div>
                          </div>
                      </div>
                  </div>
                  <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full fade-in">
                    {loading ? (
                      <div className="flex flex-col items-center justify-center h-64 text-slate-400"><Loader2 className="animate-spin mb-4 text-blue-600" size={40} /><p>Loading fleet...</p></div>
                    ) : (
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-20">
                        {filteredAndSortedAircraft.map((ac) => (
                          <AircraftCard key={ac._id} data={ac} adminMode={adminMode} onClick={() => setSelectedAircraft(ac)} onDelete={handleDelete} onEdit={(ac, e) => { e.stopPropagation(); setEditingAircraft(ac); setShowFormModal(true); }} />
                        ))}
                      </div>
                    )}
                  </main>
                  </>
              ) : currentView === 'collection' ? (
                  <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
                      <CollectionDashboard uploadedAircrafts={aircrafts} onUploadPrefill={(id, type, livery) => { setPrefillData({ aircraftId: id, aircraftType: type, liveryName: livery }); setShowFormModal(true); }} />
                  </main>
              ) : (
                  <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
                      <AirportGallery />
                  </main>
              )}

              {showFormModal && (
                <AircraftFormModal onClose={() => setShowFormModal(false)} onSuccess={() => { setShowFormModal(false); fetchAircraft(); fetchStats(); }} isDemoMode={isDemoMode} initialData={editingAircraft} prefillData={prefillData} />
              )}

              {selectedAircraft && (
                <DetailsModal aircraft={selectedAircraft} onClose={() => setSelectedAircraft(null)} adminMode={adminMode} onEdit={() => { setEditingAircraft(selectedAircraft); setSelectedAircraft(null); setShowFormModal(true); }} />
              )}
            </div>
          );
        }

        // --- AIRPORT GALLERY ---
        function AirportGallery() {
            const [icao, setIcao] = useState('');
            const [images, setImages] = useState([]);
            const [loading, setLoading] = useState(false);
            const [showUpload, setShowUpload] = useState(false);
            const [uploading, setUploading] = useState(false);
            const [uploadData, setUploadData] = useState({ icao: '', contributorName: '' });
            const fileRef = useRef(null);

            const searchAirport = async (e) => {
                if (e) e.preventDefault();
                if (!icao) return;
                setLoading(true);
                try {
                    const res = await fetch(`${AIRPORT_API}/${icao.toUpperCase()}`);
                    if (res.ok) setImages(await res.json());
                } catch (err) { console.error(err); }
                finally { setLoading(false); }
            };

            const handleUpload = async (e) => {
                e.preventDefault();
                const file = fileRef.current?.files[0];
                if (!file || !uploadData.icao || !uploadData.contributorName) return alert("All fields required");
                setUploading(true);
                const formData = new FormData();
                formData.append('image', file);
                formData.append('icao', uploadData.icao.toUpperCase());
                formData.append('contributorName', uploadData.contributorName);
                try {
                    const res = await fetch(AIRPORT_API, { method: 'POST', body: formData });
                    if (res.ok) {
                        setShowUpload(false);
                        setIcao(uploadData.icao);
                        searchAirport();
                    }
                } catch (err) { alert("Upload failed"); }
                finally { setUploading(false); }
            };

            const handleDeleteAirportImage = async (imgUrl) => {
                if (!confirm("Delete this airport image?")) return;
                try {
                    const res = await fetch(AIRPORT_API, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ imageUrl: imgUrl })
                    });
                    if (res.ok) searchAirport();
                } catch (err) { alert("Delete failed"); }
            };

            return (
                <div className="max-w-6xl mx-auto fade-in pb-20">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8">
                        <div>
                            <h2 className="text-3xl font-bold text-slate-900 dark:text-white">Airport Spotting</h2>
                            <p className="text-slate-500 dark:text-slate-400">Search terminal and tarmac photos by ICAO</p>
                        </div>
                        <div className="flex gap-2 w-full md:w-auto">
                            <form onSubmit={searchAirport} className="relative flex-1 md:w-64">
                                <input type="text" placeholder="Enter ICAO (e.g. EGLL)" className="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none uppercase font-bold" value={icao} onChange={e => setIcao(e.target.value)} />
                                <Search size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                            </form>
                            <button onClick={() => setShowUpload(true)} className="bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl shadow-lg shadow-blue-600/20 active:scale-95 transition-all"><Plus size={20} /></button>
                        </div>
                    </div>

                    {loading ? (
                        <div className="py-20 flex flex-col items-center"><Loader2 className="animate-spin text-blue-600 mb-4" size={40} /><p>Fetching images...</p></div>
                    ) : images.length > 0 ? (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            {images.map((img, idx) => (
                                <div key={idx} className="group bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm hover:shadow-xl transition-all">
                                    <div className="aspect-video bg-slate-100 dark:bg-slate-800 relative overflow-hidden">
                                        <img src={img.url} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt={img.icao} />
                                        <div className="absolute top-3 left-3 px-2 py-1 bg-black/50 backdrop-blur-md rounded text-white text-[10px] font-bold tracking-widest uppercase">{img.icao}</div>
                                        <button onClick={() => handleDeleteAirportImage(img.url)} className="absolute top-3 right-3 p-1.5 bg-red-500/80 text-white rounded-lg opacity-0 group-hover:opacity-100 transition-opacity"><Trash2 size={14}/></button>
                                    </div>
                                    <div className="p-4 flex items-center justify-between">
                                        <div className="flex items-center gap-2">
                                            <div className="w-6 h-6 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-[10px] font-bold text-slate-500 uppercase">{img.contributorName.charAt(0)}</div>
                                            <span className="text-xs font-medium text-slate-600 dark:text-slate-400">{img.contributorName}</span>
                                        </div>
                                        <span className="text-[10px] text-slate-400">{new Date(img.uploadedAt).toLocaleDateString()}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="py-24 text-center bg-white dark:bg-slate-900/50 rounded-3xl border-2 border-dashed border-slate-200 dark:border-slate-800">
                            <MapPin size={48} className="mx-auto text-slate-300 dark:text-slate-700 mb-4" />
                            <h3 className="text-lg font-bold">No images for this airport</h3>
                            <p className="text-slate-500 text-sm mt-1">Be the first to share a photo of {icao || 'the airport'}!</p>
                        </div>
                    )}

                    {showUpload && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-in fade-in">
                            <div className="bg-white dark:bg-slate-900 rounded-3xl w-full max-w-md p-8 shadow-2xl border dark:border-slate-800 animate-in zoom-in-95">
                                <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold dark:text-white">Upload Airport Photo</h3><button onClick={() => setShowUpload(false)} className="text-slate-400 hover:text-white"><X size={24}/></button></div>
                                <form onSubmit={handleUpload} className="space-y-4">
                                    <div className="space-y-1"><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Airport ICAO</label><input required className="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 uppercase font-bold" value={uploadData.icao} onChange={e => setUploadData({...uploadData, icao: e.target.value})} /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Your Name</label><input required className="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" value={uploadData.contributorName} onChange={e => setUploadData({...uploadData, contributorName: e.target.value})} /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">File</label><input type="file" ref={fileRef} className="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-50 file:text-blue-700 dark:file:bg-slate-800 dark:file:text-slate-300" accept="image/*" /></div>
                                    <button type="submit" disabled={uploading} className="w-full bg-blue-600 py-3.5 rounded-xl text-white font-bold shadow-lg disabled:opacity-50 mt-4 flex justify-center items-center gap-2">
                                        {uploading ? <Loader2 className="animate-spin" size={20}/> : <Camera size={20}/>} {uploading ? 'Processing...' : 'Upload Image'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- COLLECTION DASHBOARD ---
        function CollectionDashboard({ uploadedAircrafts, onUploadPrefill }) {
          const [masterAircraft, setMasterAircraft] = useState([]);
          const [expandedAircraftId, setExpandedAircraftId] = useState(null);
          const [masterLiveries, setMasterLiveries] = useState([]);
          const [loadingMeta, setLoadingMeta] = useState(true);
          const [loadingLiveries, setLoadingLiveries] = useState(false);

          useEffect(() => {
            const fetchMasterData = async () => {
              try {
                const res = await fetch('https://site--acars-backend--6dmjph8ltlhv.code.run/api/metadata');
                if (res.ok) {
                  const data = await res.json();
                  setMasterAircraft(data.aircraft.sort((a, b) => a.name.localeCompare(b.name)));
                }
              } catch (err) { console.warn(err); }
              finally { setLoadingMeta(false); }
            };
            fetchMasterData();
          }, []);

          const handleExpand = async (aircraftId) => {
            if (expandedAircraftId === aircraftId) {
              setExpandedAircraftId(null);
              return;
            }
            setExpandedAircraftId(aircraftId);
            setLoadingLiveries(true);
            setMasterLiveries([]);
            try {
              const res = await fetch(`https://site--acars-backend--6dmjph8ltlhv.code.run/api/aircraft/${aircraftId}/liveries`);
              if (res.ok) {
                const data = await res.json();
                setMasterLiveries(data.liveries.sort((a, b) => a.name.localeCompare(b.name)));
              }
            } catch (err) { console.warn(err); }
            finally { setLoadingLiveries(false); }
          };

          const hasType = (typeName) => uploadedAircrafts.some(a => a.aircraftType === typeName);
          const getTypeCount = (typeName) => uploadedAircrafts.filter(a => a.aircraftType === typeName).length;
          const hasLivery = (typeName, liveryName) => uploadedAircrafts.some(a => a.aircraftType === typeName && a.liveryName === liveryName);

          if (loadingMeta) return <div className="flex flex-col items-center py-20"><Loader2 className="animate-spin text-blue-600 mb-4" size={40}/><p>Analyzing fleet data...</p></div>;

          const collectedTypes = masterAircraft.filter(a => hasType(a.name)).length;
          const progressPercent = Math.round((collectedTypes / masterAircraft.length) * 100);

          return (
            <div className="max-w-5xl mx-auto pb-20 fade-in">
              <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border dark:border-slate-800 mb-8">
                <div className="flex justify-between mb-4">
                  <div><h2 className="text-xl font-bold">Collection Status</h2><p className="text-sm text-slate-500">Fleet completion against master database</p></div>
                  <div className="text-right"><span className="text-3xl font-bold text-blue-600">{progressPercent}%</span><p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Completion</p></div>
                </div>
                <div className="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-3 overflow-hidden"><div className="bg-blue-600 h-full rounded-full transition-all duration-1000" style={{ width: `${progressPercent}%` }}></div></div>
                <div className="mt-2 text-xs text-slate-500 text-right">{collectedTypes} of {masterAircraft.length} Aircraft Types Collected</div>
              </div>
              <div className="grid gap-4">
                {masterAircraft.map((ac) => {
                  const isCollected = hasType(ac.name);
                  const isExpanded = expandedAircraftId === ac.id;
                  const count = getTypeCount(ac.name);
                  return (
                    <div key={ac.id} className={`bg-white dark:bg-slate-900 rounded-xl border transition-all duration-300 overflow-hidden ${isCollected ? 'border-slate-200 dark:border-slate-800' : 'border-amber-200 dark:border-amber-900/50'}`}>
                      <div onClick={() => handleExpand(ac.id)} className={`p-4 flex items-center justify-between cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 ${isExpanded ? 'bg-slate-50 dark:bg-slate-800/50' : ''}`}>
                        <div className="flex items-center gap-4">
                          <div className={`w-10 h-10 rounded-full flex items-center justify-center shrink-0 ${isCollected ? 'bg-blue-100 dark:bg-blue-900/30 text-blue-600' : 'bg-slate-100 dark:bg-slate-800 text-slate-400'}`}>{isCollected ? <CheckCircle2 size={20} /> : <Plane size={20} />}</div>
                          <div><h3 className={`font-bold text-lg ${isCollected ? 'text-slate-900 dark:text-white' : 'text-slate-500'}`}>{ac.name}</h3><p className="text-xs text-slate-500">{isCollected ? <span className="text-blue-600 font-medium">{count} Photos in fleet</span> : <span className="text-amber-600 font-medium">Missing from fleet</span>}</p></div>
                        </div>
                        <div className="flex items-center gap-2"><span className="text-xs font-semibold text-slate-400 uppercase tracking-wide mr-2 hidden sm:block">{isExpanded ? 'Hide' : 'View'} Liveries</span><ChevronDown size={20} className={`text-slate-400 transition-transform ${isExpanded ? 'rotate-180' : ''}`} /></div>
                      </div>
                      {isExpanded && (
                        <div className="border-t border-slate-100 dark:border-slate-800 p-4 bg-slate-50/50 dark:bg-slate-950/30 animate-in slide-in-from-top-2">
                          {loadingLiveries ? <div className="flex items-center gap-2 text-slate-400 text-sm py-4"><Loader2 className="animate-spin" size={16} /> Fetching liveries...</div> : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                              {masterLiveries.map(liv => {
                                const haveLivery = hasLivery(ac.name, liv.name);
                                return (
                                  <div key={liv.id} className="flex items-center justify-between p-3 bg-white dark:bg-slate-900 rounded-lg border dark:border-slate-800">
                                    <div className="flex items-center gap-2 overflow-hidden"><div className={`w-2 h-2 rounded-full shrink-0 ${haveLivery ? 'bg-green-500' : 'bg-slate-300'}`}></div><span className={`text-sm truncate ${haveLivery ? 'text-slate-900 dark:text-white font-medium' : 'text-slate-500'}`}>{liv.name}</span></div>
                                    {!haveLivery && <button onClick={(e) => { e.stopPropagation(); onUploadPrefill(ac.id, ac.name, liv.name); }} className="text-xs bg-blue-50 dark:bg-blue-900/20 text-blue-600 px-2 py-1 rounded-md font-medium">Upload</button>}
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        }

        // --- AIRCRAFT FORM MODAL ---
        function AircraftFormModal({ onClose, onSuccess, isDemoMode, initialData = null, prefillData = null }) {
          const isEditMode = !!initialData;
          const [loading, setLoading] = useState(false);
          const [fetchingMeta, setFetchingMeta] = useState(true);
          const [metadata, setMetadata] = useState({ aircraft: [] }); 
          const [specificLiveries, setSpecificLiveries] = useState([]); 
          const [loadingLiveries, setLoadingLiveries] = useState(false);
          const fileInputRef = useRef(null);
          const [preview, setPreview] = useState(initialData ? initialData.imageUrl : null);
          const [formData, setFormData] = useState({
            contributorName: initialData?.contributorName || '',
            aircraftType: initialData?.aircraftType || prefillData?.aircraftType || '',
            aircraftId: prefillData?.aircraftId || '', 
            liveryName: initialData?.liveryName || prefillData?.liveryName || '',
            tailNumber: initialData?.tailNumber || ''
          });

          useEffect(() => {
            const init = async () => {
                try {
                    const res = await fetch('https://site--acars-backend--6dmjph8ltlhv.code.run/api/metadata');
                    if (res.ok) {
                        const data = await res.json();
                        const sortedAircraft = data.aircraft.sort((a, b) => a.name.localeCompare(b.name));
                        setMetadata({ aircraft: sortedAircraft });
                        if (isEditMode && initialData.aircraftType) {
                            const match = sortedAircraft.find(a => a.name === initialData.aircraftType);
                            if (match) { setFormData(prev => ({ ...prev, aircraftId: match.id })); fetchLiveries(match.id, initialData.liveryName); }
                        } else if (prefillData?.aircraftId) fetchLiveries(prefillData.aircraftId, prefillData.liveryName);
                    }
                } catch (err) { console.warn(err); } finally { setFetchingMeta(false); }
            };
            init();
          }, []);

          const fetchLiveries = async (aircraftId, preLivery = null) => {
             setLoadingLiveries(true);
             try {
                const res = await fetch(`https://site--acars-backend--6dmjph8ltlhv.code.run/api/aircraft/${aircraftId}/liveries`);
                if (res.ok) {
                    const data = await res.json();
                    setSpecificLiveries(data.liveries.sort((a, b) => a.name.localeCompare(b.name)));
                    if (!preLivery) setFormData(prev => ({ ...prev, liveryName: '' }));
                }
             } catch (err) { console.warn(err); } finally { setLoadingLiveries(false); }
          };

          const handleAircraftChange = (e) => {
             const id = e.target.value;
             const obj = metadata.aircraft.find(a => a.id === id);
             setFormData({ ...formData, aircraftId: id, aircraftType: obj?.name || '', liveryName: '' });
             setSpecificLiveries([]);
             if (id) fetchLiveries(id);
          };

          const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            try {
              const data = new FormData();
              Object.entries(formData).forEach(([k,v]) => data.append(k, v));
              if (fileInputRef.current?.files[0]) data.append('image', fileInputRef.current.files[0]);
              else if (!isEditMode) return alert('Image required');
              const method = isEditMode ? 'PUT' : 'POST';
              const url = isEditMode ? `${API_URL}/${initialData._id}` : API_URL;
              const res = await fetch(url, { method, body: data });
              if (res.ok) onSuccess();
            } catch (err) { alert(err.message); } finally { setLoading(false); }
          };

          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md animate-in fade-in">
              <div className="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-2xl shadow-xl overflow-hidden animate-in zoom-in-95 flex flex-col max-h-[90vh] border dark:border-slate-800">
                <div className="px-6 py-4 border-b dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900/50">
                  <h2 className="text-lg font-bold flex items-center gap-2">{isEditMode ? <Edit size={20}/> : <Upload size={20}/>} {isEditMode ? 'Edit' : 'Upload'} Aircraft</h2>
                  <button onClick={onClose} className="p-2 text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-all"><X size={20} /></button>
                </div>
                <div className="flex-1 overflow-y-auto p-6">
                    <form onSubmit={handleSubmit} className="space-y-6">
                    <div className="relative group w-full"><input type="file" ref={fileInputRef} accept="image/*" onChange={(e) => e.target.files[0] && setPreview(URL.createObjectURL(e.target.files[0]))} className={`absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20 ${preview ? 'h-0' : ''}`} /><div className={`relative w-full overflow-hidden rounded-2xl transition-all ${preview ? 'aspect-video' : 'h-48 border-2 border-dashed border-slate-300 dark:border-slate-700 flex flex-col items-center justify-center'}`}>{preview ? <img src={preview} className="absolute inset-0 w-full h-full object-cover" /> : <Camera size={32} className="text-slate-400" />}</div></div>
                    <div className="grid grid-cols-2 gap-4">
                        <div className="space-y-1"><label className="text-xs font-bold text-slate-500 uppercase">Tail</label><input required className="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-xl uppercase font-bold" value={formData.tailNumber} onChange={e => setFormData({...formData, tailNumber: e.target.value})}/></div>
                        <div className="space-y-1"><label className="text-xs font-bold text-slate-500 uppercase">Your Name</label><input required className="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-xl" value={formData.contributorName} onChange={e => setFormData({...formData, contributorName: e.target.value})}/></div>
                    </div>
                    <div className="space-y-1"><label className="text-xs font-bold text-slate-500 uppercase">Type</label><select required className="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-xl" value={formData.aircraftId} onChange={handleAircraftChange}><option value="">Select Aircraft...</option>{metadata.aircraft.map(ac => <option key={ac.id} value={ac.id}>{ac.name}</option>)}</select></div>
                    <div className="space-y-1"><label className="text-xs font-bold text-slate-500 uppercase">Livery</label><select required disabled={!formData.aircraftId || loadingLiveries} className="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-xl disabled:opacity-50" value={formData.liveryName} onChange={e => setFormData({...formData, liveryName: e.target.value})}><option value="">{loadingLiveries ? "Loading..." : "Select Livery..."}</option>{specificLiveries.map(livery => <option key={livery.id} value={livery.name}>{livery.name}</option>)}</select></div>
                    <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg flex justify-center items-center gap-2">{loading ? <Loader2 className="animate-spin" size={20}/> : <CheckCircle2 size={20}/>}{loading ? 'Saving...' : 'Submit'}</button>
                    </form>
                </div>
              </div>
            </div>
          );
        }

        // --- SUB-COMPONENTS ---
        function FilterSelect({ label, options, value, onChange }) {
            return (
                <div className="relative group">
                    <select value={value} onChange={onChange} className="appearance-none pl-3 pr-8 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 border border-transparent text-slate-700 dark:text-slate-200 text-sm font-medium focus:outline-none cursor-pointer min-w-[140px]">
                        {options.map(opt => <option key={opt} value={opt}>{label}: {opt}</option>)}
                    </select>
                    <ChevronDown size={14} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
                </div>
            );
        }

        function AircraftCard({ data, onClick, onDelete, onEdit }) {
          return (
            <div onClick={onClick} className="group bg-white dark:bg-slate-900 rounded-2xl shadow-sm border dark:border-slate-800 overflow-hidden hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer relative flex flex-col h-full fade-in">
              <div className="relative aspect-[4/3] bg-slate-100 dark:bg-slate-800 overflow-hidden"><img src={data.imageUrl} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" /><div className="absolute top-3 right-3 bg-white/90 dark:bg-slate-950/90 backdrop-blur-sm px-2.5 py-1 rounded-md text-xs font-bold shadow-sm text-slate-800 dark:text-slate-200 border dark:border-slate-800">{data.tailNumber}</div></div>
              <div className="p-5 flex-1 flex flex-col">
                <div className="flex-1"><h3 className="font-bold text-slate-900 dark:text-white truncate text-lg mb-1">{data.aircraftType}</h3><p className="text-sm text-slate-500 flex items-center gap-1.5"><Camera size={12} />{data.liveryName}</p></div>
                <div className="flex items-center justify-between pt-4 mt-2 border-t dark:border-slate-800">
                  <div className="flex items-center gap-2 text-xs text-slate-500"><div className="w-5 h-5 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold">{data.contributorName.charAt(0)}</div><span className="truncate max-w-[100px]">{data.contributorName}</span></div>
                  <div className="flex items-center gap-1"><button onClick={(e) => onEdit(data, e)} className="text-slate-400 hover:text-blue-500 p-1.5 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-full"><Pencil size={16} /></button><button onClick={(e) => onDelete(data._id, e)} className="text-slate-400 hover:text-red-500 p-1.5 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-full"><Trash2 size={16} /></button></div>
                </div>
              </div>
            </div>
          );
        }

        function DetailsModal({ aircraft, onClose, onEdit }) {
          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md animate-in fade-in" onClick={onClose}>
              <div className="bg-white dark:bg-slate-900 rounded-3xl w-full max-w-5xl max-h-[90vh] overflow-hidden shadow-2xl flex flex-col md:flex-row relative animate-in zoom-in-95 border dark:border-slate-700" onClick={e => e.stopPropagation()}>
                <button onClick={onClose} className="absolute top-4 right-4 z-20 p-2 bg-black/40 text-white rounded-full"><X size={20} /></button>
                <div className="w-full md:w-3/5 bg-slate-950 flex items-center justify-center"><img src={aircraft.imageUrl} className="w-full h-full object-contain max-h-[40vh] md:max-h-full" /></div>
                <div className="w-full md:w-2/5 p-8 flex flex-col bg-white dark:bg-slate-900">
                  <div className="mb-8"><div className="flex justify-between items-start"><div><div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 text-xs font-bold uppercase tracking-wider mb-3"><Plane size={12} /> Profile</div><h2 className="text-4xl font-bold tracking-tight">{aircraft.tailNumber}</h2></div><button onClick={onEdit} className="p-2 bg-slate-100 dark:bg-slate-800 rounded-full"><Edit size={20} /></button></div><p className="text-xl text-slate-500 mt-2">{aircraft.aircraftType}</p></div>
                  <div className="space-y-6 flex-1">
                    <InfoRow icon={<Camera />} label="Livery" value={aircraft.liveryName} />
                    <InfoRow icon={<User />} label="Spotted By" value={aircraft.contributorName} />
                    <InfoRow icon={<Hash />} label="Uploaded" value={new Date(aircraft.uploadedAt).toLocaleDateString()} />
                  </div>
                  <button onClick={onClose} className="mt-8 w-full py-3 bg-slate-100 dark:bg-slate-800 font-semibold rounded-xl">Close</button>
                </div>
              </div>
            </div>
          );
        }

        function InfoRow({ icon, label, value }) {
          return (
            <div className="flex items-start gap-4">
              <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-xl text-slate-400">{React.cloneElement(icon, { size: 20 })}</div>
              <div><p className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-0.5">{label}</p><p className="text-base font-medium">{value}</p></div>
            </div>
          );
        }
        
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
