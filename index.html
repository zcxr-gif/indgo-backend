<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroGallery | Advanced Fleet Database</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#151f32',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "./AirportManager": "./AirportManager.js"
      }
    }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          Plane, Upload, Search, X, Info, Camera, User, Tag, Hash, Trash2,
          AlertCircle, CheckCircle2, Loader2, Edit, Pencil, Moon, Sun,
          Filter, SlidersHorizontal, Settings, Shield, BarChart3, ChevronDown,
          Database, Cloud, Server, HardDrive, LayoutGrid, ListChecks, MapPin
        } from 'lucide-react';

        // Import the new Airport Component
        import { AirportGallery } from './AirportManager';

        const IS_LOCALHOST = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

        const API_URL = IS_LOCALHOST
          ? 'http://localhost:5000/api/aircraft'
          : '/api/aircraft';
        
        const STATS_URL = IS_LOCALHOST
          ? 'http://localhost:5000/api/admin/stats'
          : '/api/admin/stats';

        const DEMO_DATA = [
          { _id: '1', contributorName: 'Captain Dave', aircraftType: 'Boeing 737-800', liveryName: 'SkyBlue Airlines', tailNumber: 'N737SB', imageUrl: 'https://images.unsplash.com/photo-1540962351504-03099e0a754b?auto=format&fit=crop&q=80&w=1000', uploadedAt: new Date().toISOString() },
          { _id: '2', contributorName: 'Sarah Aviator', aircraftType: 'Airbus A320', liveryName: 'Ocean Air', tailNumber: 'F-OCEA', imageUrl: 'https://images.unsplash.com/photo-1569154941061-e231b4725ef1?auto=format&fit=crop&q=80&w=1000', uploadedAt: new Date(Date.now() - 86400000).toISOString() },
          { _id: '3', contributorName: 'Mike Zulu', aircraftType: 'Cessna 172', liveryName: 'Private', tailNumber: 'N172SP', imageUrl: 'https://images.unsplash.com/photo-1559067515-bf7d799b23e2?auto=format&fit=crop&q=80&w=1000', uploadedAt: new Date(Date.now() - 172800000).toISOString() },
        ];

        const DEMO_METADATA_AIRCRAFT = [
            { id: 'a1', name: 'Airbus A320' }, { id: 'a2', name: 'Airbus A350' },
            { id: 'a3', name: 'Boeing 737-800' }, { id: 'a4', name: 'Boeing 777-300ER' },
            { id: 'a5', name: 'Bombardier CRJ-900' }, { id: 'a6', name: 'Cessna 172' },
            { id: 'a7', name: 'Embraer E175' }
        ];

        const DEMO_METADATA_LIVERIES = [
            { id: 'l1', name: 'Standard / House' }, { id: 'l2', name: 'SkyBlue Airlines' },
            { id: 'l3', name: 'Ocean Air' }, { id: 'l4', name: 'Private' }
        ];

        function formatBytes(bytes, decimals = 1) {
            if (!+bytes) return '0 B';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        function App() {
          const [aircrafts, setAircrafts] = useState([]);
          const [stats, setStats] = useState(null);
          const [loading, setLoading] = useState(true);
          const [isDemoMode, setIsDemoMode] = useState(false);
          const [theme, setTheme] = useState('light');
          const [currentView, setCurrentView] = useState('gallery'); // 'gallery', 'collection', or 'airports'
          const [searchTerm, setSearchTerm] = useState('');
          const [filterType, setFilterType] = useState('All');
          const [filterContributor, setFilterContributor] = useState('All');
          const [sortBy, setSortBy] = useState('newest');
          const [adminMode, setAdminMode] = useState(true);
          const [showFormModal, setShowFormModal] = useState(false);
          const [editingAircraft, setEditingAircraft] = useState(null);
          const [selectedAircraft, setSelectedAircraft] = useState(null);
          const [prefillData, setPrefillData] = useState(null);

          useEffect(() => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                setTheme(savedTheme);
                document.documentElement.classList.toggle('dark', savedTheme === 'dark');
            }
            fetchAircraft();
            fetchStats();
          }, []);

          const toggleTheme = () => {
              const newTheme = theme === 'light' ? 'dark' : 'light';
              setTheme(newTheme);
              localStorage.setItem('theme', newTheme);
              document.documentElement.classList.toggle('dark');
          };

          const fetchStats = async () => {
              try {
                  const res = await fetch(STATS_URL);
                  if (res.ok) {
                      const data = await res.json();
                      setStats(data);
                  }
              } catch (err) { console.warn("Stats service unavailable"); }
          };

          const fetchAircraft = async () => {
            setLoading(true);
            try {
              const response = await fetch(API_URL);
              if (!response.ok) throw new Error('Failed to connect');
              const data = await response.json();
              setAircrafts(data);
              setIsDemoMode(false);
            } catch (error) {
              setAircrafts(DEMO_DATA);
              setIsDemoMode(true);
            } finally { setLoading(false); }
          };

          const uniqueTypes = useMemo(() => ['All', ...new Set(aircrafts.map(a => a.aircraftType).filter(Boolean).sort())], [aircrafts]);
          const uniqueContributors = useMemo(() => ['All', ...new Set(aircrafts.map(a => a.contributorName).filter(Boolean).sort())], [aircrafts]);

          const filteredAndSortedAircraft = useMemo(() => {
              let result = [...aircrafts];
              if (searchTerm) {
                  const lower = searchTerm.toLowerCase();
                  result = result.filter(ac => 
                    ac.tailNumber.toLowerCase().includes(lower) ||
                    ac.aircraftType.toLowerCase().includes(lower) ||
                    ac.liveryName.toLowerCase().includes(lower)
                  );
              }
              if (filterType !== 'All') result = result.filter(ac => ac.aircraftType === filterType);
              if (filterContributor !== 'All') result = result.filter(ac => ac.contributorName === filterContributor);
              result.sort((a, b) => {
                  if (sortBy === 'newest') return new Date(b.uploadedAt) - new Date(a.uploadedAt);
                  if (sortBy === 'oldest') return new Date(a.uploadedAt) - new Date(b.uploadedAt);
                  if (sortBy === 'az') return a.tailNumber.localeCompare(b.tailNumber);
                  return 0;
              });
              return result;
          }, [aircrafts, searchTerm, filterType, filterContributor, sortBy]);

          const handleEdit = (aircraft, e) => {
            if(e) e.stopPropagation();
            setEditingAircraft(aircraft);
            setPrefillData(null);
            setShowFormModal(true);
          };

          const handleCreate = () => {
            setEditingAircraft(null);
            setPrefillData(null);
            setShowFormModal(true);
          };

          const handlePrefillUpload = (aircraftId, aircraftType, liveryName) => {
              setEditingAircraft(null);
              setPrefillData({ aircraftId, aircraftType, liveryName });
              setShowFormModal(true);
          };

          const handleDelete = async (id, e) => {
            if(e) e.stopPropagation();
            if (!confirm('Are you sure you want to delete this aircraft?')) return;
            if (isDemoMode) {
              setAircrafts(prev => prev.filter(a => a._id !== id));
              return;
            }
            try {
              await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
              fetchAircraft();
              fetchStats();
              if (selectedAircraft && selectedAircraft._id === id) setSelectedAircraft(null);
            } catch (error) { alert('Error deleting aircraft'); }
          };

          return (
            <div className="min-h-screen flex flex-col font-sans selection:bg-blue-200 dark:selection:bg-blue-900">
              
              <nav className="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-colors duration-300">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex items-center justify-between h-16">
                    
                    <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentView('gallery')}>
                        <div className="bg-gradient-to-br from-blue-600 to-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-blue-500/20">
                            <Plane size={20} fill="currentColor" className="transform -rotate-45" />
                        </div>
                        <div className="hidden sm:block">
                            <h1 className="text-lg font-bold tracking-tight text-slate-900 dark:text-white">AeroGallery</h1>
                            <p className="text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 tracking-wider">Fleet Database</p>
                        </div>
                    </div>

                    <div className="hidden md:flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-lg">
                        <button 
                            onClick={() => setCurrentView('gallery')}
                            className={`flex items-center gap-2 px-3 py-1.5 text-xs font-bold uppercase tracking-wide rounded-md transition-all ${currentView === 'gallery' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-50'}`}
                        >
                            <LayoutGrid size={14} /> Gallery
                        </button>
                        <button 
                            onClick={() => setCurrentView('collection')}
                            className={`flex items-center gap-2 px-3 py-1.5 text-xs font-bold uppercase tracking-wide rounded-md transition-all ${currentView === 'collection' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-500'}`}
                        >
                            <ListChecks size={14} /> Checklist
                        </button>
                        <button 
                            onClick={() => setCurrentView('airports')}
                            className={`flex items-center gap-2 px-3 py-1.5 text-xs font-bold uppercase tracking-wide rounded-md transition-all ${currentView === 'airports' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-500'}`}
                        >
                            <MapPin size={14} /> Airports
                        </button>
                    </div>

                    <div className="flex items-center gap-2 sm:gap-3">
                        <button onClick={toggleTheme} className="p-2 text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 rounded-lg transition-colors">
                            {theme === 'light' ? <Moon size={20}/> : <Sun size={20}/>}
                        </button>
                        <button 
                            onClick={handleCreate}
                            className="hidden sm:flex items-center gap-2 bg-slate-900 dark:bg-blue-600 hover:bg-slate-800 dark:hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-all shadow-lg hover:shadow-xl active:scale-95"
                        >
                            <Upload size={16} />
                            <span>Upload</span>
                        </button>
                    </div>
                  </div>
                </div>
              </nav>

              <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
                {currentView === 'gallery' && (
                  <div className="fade-in">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                        <div className="flex flex-wrap items-center gap-4 text-sm text-slate-500 dark:text-slate-400">
                              <div className="flex items-center gap-2">
                                  <BarChart3 size={16} />
                                  <span className="font-medium text-slate-900 dark:text-white">{aircrafts.length}</span> <span className="hidden sm:inline">Aircraft</span>
                              </div>
                              {stats && (
                                  <>
                                      <div className="flex items-center gap-2" title="S3 Object Storage Usage">
                                          <Cloud size={16} className="text-blue-500" />
                                          <span className="font-medium text-slate-900 dark:text-white">{formatBytes(stats.s3SizeBytes)}</span> 
                                      </div>
                                      <div className="flex items-center gap-2" title="MongoDB Storage Usage">
                                          <Database size={16} className="text-indigo-500" />
                                          <span className="font-medium text-slate-900 dark:text-white">{formatBytes(stats.dbSizeBytes)}</span> 
                                      </div>
                                  </>
                              )}
                        </div>
                        <div className="flex flex-wrap items-center gap-3">
                            <div className="relative">
                                  <input
                                      type="text"
                                      className="pl-3 pr-8 py-1.5 border border-slate-200 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                                      placeholder="Quick search..."
                                      value={searchTerm}
                                      onChange={(e) => setSearchTerm(e.target.value)}
                                  />
                                  <Search size={14} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400" />
                            </div>
                            <FilterSelect label="Type" options={uniqueTypes} value={filterType} onChange={(e) => setFilterType(e.target.value)} />
                            <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-transparent text-sm font-medium text-slate-700 dark:text-slate-300 border-none focus:ring-0 cursor-pointer">
                                <option value="newest">Newest First</option>
                                <option value="oldest">Oldest First</option>
                                <option value="az">A-Z (Tail)</option>
                            </select>
                        </div>
                    </div>

                    {loading ? (
                      <div className="flex flex-col items-center justify-center py-20"><Loader2 className="animate-spin mb-4 text-blue-600" size={40} /></div>
                    ) : filteredAndSortedAircraft.length === 0 ? (
                      <div className="text-center py-20">No aircraft found.</div>
                    ) : (
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        {filteredAndSortedAircraft.map((aircraft) => (
                          <AircraftCard 
                            key={aircraft._id} 
                            data={aircraft} 
                            adminMode={adminMode}
                            onClick={() => setSelectedAircraft(aircraft)}
                            onDelete={handleDelete}
                            onEdit={handleEdit}
                          />
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {currentView === 'collection' && (
                    <CollectionDashboard 
                        uploadedAircrafts={aircrafts} 
                        onUploadPrefill={handlePrefillUpload}
                    />
                )}

                {currentView === 'airports' && (
                    <AirportGallery />
                )}
              </main>

              {showFormModal && (
                <AircraftFormModal 
                  onClose={() => setShowFormModal(false)} 
                  onSuccess={() => { setShowFormModal(false); fetchAircraft(); fetchStats(); }}
                  isDemoMode={isDemoMode}
                  initialData={editingAircraft}
                  prefillData={prefillData}
                />
              )}

              {selectedAircraft && (
                <DetailsModal 
                  aircraft={selectedAircraft} 
                  onClose={() => setSelectedAircraft(null)}
                  adminMode={adminMode}
                  onEdit={(e) => { handleEdit(selectedAircraft, e); setSelectedAircraft(null); }} 
                />
              )}
            </div>
          );
        }

        function CollectionDashboard({ uploadedAircrafts, onUploadPrefill }) {
          const [masterAircraft, setMasterAircraft] = useState([]);
          const [expandedAircraftId, setExpandedAircraftId] = useState(null);
          const [masterLiveries, setMasterLiveries] = useState([]);
          const [loadingMeta, setLoadingMeta] = useState(true);
          const [loadingLiveries, setLoadingLiveries] = useState(false);

          useEffect(() => {
            const fetchMasterData = async () => {
              try {
                const res = await fetch('https://site--acars-backend--6dmjph8ltlhv.code.run/api/metadata');
                const data = await res.json();
                setMasterAircraft(data.aircraft.sort((a, b) => a.name.localeCompare(b.name)));
              } catch (err) { console.warn("Metadata fetch failed", err); }
              finally { setLoadingMeta(false); }
            };
            fetchMasterData();
          }, []);

          const handleExpand = async (aircraftId) => {
            if (expandedAircraftId === aircraftId) { setExpandedAircraftId(null); return; }
            setExpandedAircraftId(aircraftId);
            setLoadingLiveries(true);
            try {
              const res = await fetch(`https://site--acars-backend--6dmjph8ltlhv.code.run/api/aircraft/${aircraftId}/liveries`);
              if (res.ok) {
                const data = await res.json();
                setMasterLiveries(data.liveries.sort((a, b) => a.name.localeCompare(b.name)));
              }
            } catch (err) { console.warn("Livery fetch failed", err); }
            finally { setLoadingLiveries(false); }
          };

          const hasType = (typeName) => uploadedAircrafts.some(a => a.aircraftType === typeName);
          const getTypeCount = (typeName) => uploadedAircrafts.filter(a => a.aircraftType === typeName).length;
          const hasLivery = (typeName, liveryName) => uploadedAircrafts.some(a => a.aircraftType === typeName && a.liveryName === liveryName);

          if (loadingMeta) return <div className="text-center py-20"><Loader2 className="animate-spin inline mr-2"/> Loading...</div>;

          const collectedTypes = masterAircraft.filter(a => hasType(a.name)).length;
          const progressPercent = Math.round((collectedTypes / masterAircraft.length) * 100);

          return (
            <div className="max-w-5xl mx-auto pb-20 fade-in">
              <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 border border-slate-200 dark:border-slate-800 mb-8">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-xl font-bold">Collection Status</h2>
                  <span className="text-3xl font-bold text-blue-600">{progressPercent}%</span>
                </div>
                <div className="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-3 overflow-hidden">
                  <div className="bg-blue-600 h-full rounded-full transition-all duration-1000" style={{ width: `${progressPercent}%` }}></div>
                </div>
              </div>

              <div className="grid gap-4">
                {masterAircraft.map((ac) => {
                  const isCollected = hasType(ac.name);
                  const isExpanded = expandedAircraftId === ac.id;
                  return (
                    <div key={ac.id} className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
                      <div onClick={() => handleExpand(ac.id)} className="p-4 flex items-center justify-between cursor-pointer hover:bg-slate-50">
                        <div className="flex items-center gap-4">
                          <div className={`w-10 h-10 rounded-full flex items-center justify-center ${isCollected ? 'bg-blue-100 text-blue-600' : 'bg-slate-100 text-slate-400'}`}>
                             {isCollected ? <CheckCircle2 size={20} /> : <Plane size={20} />}
                          </div>
                          <div>
                            <h3 className="font-bold">{ac.name}</h3>
                            <p className="text-xs text-slate-500">{isCollected ? `${getTypeCount(ac.name)} photos` : 'Missing'}</p>
                          </div>
                        </div>
                        <ChevronDown size={20} className={`text-slate-400 transition-transform ${isExpanded ? 'rotate-180' : ''}`} />
                      </div>

                      {isExpanded && (
                        <div className="p-4 bg-slate-50/50 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                          {loadingLiveries ? <Loader2 className="animate-spin"/> : masterLiveries.map(liv => (
                            <div key={liv.id} className="flex items-center justify-between p-3 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800">
                              <span className="text-sm truncate">{liv.name}</span>
                              {!hasLivery(ac.name, liv.name) && (
                                <button onClick={() => onUploadPrefill(ac.id, ac.name, liv.name)} className="text-xs text-blue-600 font-bold">Upload</button>
                              )}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        }

        function FilterSelect({ label, options, value, onChange }) {
            return (
                <div className="relative">
                    <select value={value} onChange={onChange} className="appearance-none pl-3 pr-8 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm font-medium focus:ring-2 focus:ring-blue-500 cursor-pointer min-w-[140px]">
                        {options.map(opt => (
                            <option key={opt} value={opt}>{label}: {opt}</option>
                        ))}
                    </select>
                    <ChevronDown size={14} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
                </div>
            );
        }

        function AircraftCard({ data, onClick, onDelete, onEdit, adminMode }) {
          return (
            <div onClick={onClick} className="group bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden hover:shadow-xl transition-all cursor-pointer flex flex-col h-full fade-in">
              <div className="relative aspect-[4/3] bg-slate-100 overflow-hidden">
                <img src={data.imageUrl} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" onError={(e) => { e.target.src = 'https://via.placeholder.com/400x300'; }} />
                <div className="absolute top-3 right-3 bg-white/90 px-2.5 py-1 rounded-md text-xs font-bold">{data.tailNumber}</div>
              </div>
              <div className="p-5 flex-1 flex flex-col">
                <h3 className="font-bold text-lg mb-1 truncate">{data.aircraftType}</h3>
                <p className="text-sm text-slate-500 truncate mb-4">{data.liveryName}</p>
                <div className="flex items-center justify-between pt-4 border-t border-slate-100">
                  <span className="text-xs text-slate-400">{data.contributorName}</span>
                  {adminMode && (
                    <div className="flex gap-1">
                      <button onClick={(e) => onEdit(data, e)} className="p-1.5 text-slate-400 hover:text-blue-500"><Pencil size={16}/></button>
                      <button onClick={(e) => onDelete(data._id, e)} className="p-1.5 text-slate-400 hover:text-red-500"><Trash2 size={16}/></button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        function DetailsModal({ aircraft, onClose, adminMode, onEdit }) {
          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md">
              <div onClick={(e) => e.stopPropagation()} className="bg-white dark:bg-slate-900 rounded-3xl w-full max-w-5xl max-h-[90vh] overflow-hidden flex flex-col md:flex-row relative">
                <button onClick={onClose} className="absolute top-4 right-4 z-20 p-2 bg-black/40 text-white rounded-full"><X size={20} /></button>
                <div className="w-full md:w-3/5 bg-slate-950 flex items-center justify-center">
                   <img src={aircraft.imageUrl} className="w-full h-full object-contain max-h-[40vh] md:max-h-full" />
                </div>
                <div className="w-full md:w-2/5 p-8 overflow-y-auto">
                  <h2 className="text-4xl font-bold mb-2">{aircraft.tailNumber}</h2>
                  <p className="text-xl text-slate-500 mb-8">{aircraft.aircraftType}</p>
                  <div className="space-y-6">
                    <InfoRow icon={<Camera />} label="Livery" value={aircraft.liveryName} />
                    <InfoRow icon={<User />} label="Contributor" value={aircraft.contributorName} />
                  </div>
                  <button onClick={onClose} className="w-full mt-8 py-3 bg-slate-100 rounded-xl font-semibold">Close</button>
                </div>
              </div>
            </div>
          );
        }

        function InfoRow({ icon, label, value }) {
          return (
            <div className="flex gap-4">
              <div className="p-3 bg-slate-50 rounded-xl text-slate-400">{React.cloneElement(icon, { size: 20 })}</div>
              <div>
                <p className="text-xs font-bold text-slate-400 uppercase">{label}</p>
                <p className="font-medium">{value}</p>
              </div>
            </div>
          );
        }

        function AircraftFormModal({ onClose, onSuccess, isDemoMode, initialData, prefillData }) {
          const isEditMode = !!initialData;
          const [loading, setLoading] = useState(false);
          const [metadata, setMetadata] = useState({ aircraft: [] });
          const [specificLiveries, setSpecificLiveries] = useState([]);
          const [loadingLiveries, setLoadingLiveries] = useState(false);
          const fileInputRef = useRef(null);
          const [preview, setPreview] = useState(initialData ? initialData.imageUrl : null);
          const [formData, setFormData] = useState({
            contributorName: initialData?.contributorName || '',
            aircraftType: initialData?.aircraftType || prefillData?.aircraftType || '',
            aircraftId: prefillData?.aircraftId || '',
            liveryName: initialData?.liveryName || prefillData?.liveryName || '',
            tailNumber: initialData?.tailNumber || ''
          });

          useEffect(() => {
            const init = async () => {
                try {
                    const res = await fetch('https://site--acars-backend--6dmjph8ltlhv.code.run/api/metadata');
                    const data = await res.json();
                    setMetadata({ aircraft: data.aircraft.sort((a, b) => a.name.localeCompare(b.name)) });
                    if (prefillData?.aircraftId) fetchLiveries(prefillData.aircraftId, prefillData.liveryName);
                } catch (err) { setMetadata({ aircraft: DEMO_METADATA_AIRCRAFT }); }
            };
            init();
          }, []);

          const fetchLiveries = async (aircraftId, preName) => {
             setLoadingLiveries(true);
             try {
                const res = await fetch(`https://site--acars-backend--6dmjph8ltlhv.code.run/api/aircraft/${aircraftId}/liveries`);
                const data = await res.json();
                setSpecificLiveries(data.liveries);
             } catch (err) { setSpecificLiveries(DEMO_METADATA_LIVERIES); }
             finally { setLoadingLiveries(false); }
          };

          const handleAircraftChange = (e) => {
             const selectedId = e.target.value;
             const ac = metadata.aircraft.find(a => a.id === selectedId);
             setFormData({ ...formData, aircraftId: selectedId, aircraftType: ac?.name || '', liveryName: '' });
             if (selectedId) fetchLiveries(selectedId);
          };

          const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            const data = new FormData();
            Object.keys(formData).forEach(key => data.append(key, formData[key]));
            if (fileInputRef.current.files[0]) data.append('image', fileInputRef.current.files[0]);
            
            try {
              const url = isEditMode ? `${API_URL}/${initialData._id}` : API_URL;
              await fetch(url, { method: isEditMode ? 'PUT' : 'POST', body: data });
              onSuccess();
            } catch (err) { alert('Failed'); }
            finally { setLoading(false); }
          };

          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md">
              <div className="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-2xl shadow-xl overflow-y-auto max-h-[90vh]">
                <div className="p-6 border-b flex justify-between">
                  <h2 className="text-lg font-bold">{isEditMode ? 'Edit' : 'Upload'} Aircraft</h2>
                  <button onClick={onClose}><X size={20}/></button>
                </div>
                <form onSubmit={handleSubmit} className="p-6 space-y-6">
                    <div onClick={() => fileInputRef.current.click()} className="h-48 border-2 border-dashed rounded-2xl flex flex-col items-center justify-center cursor-pointer overflow-hidden">
                        {preview ? <img src={preview} className="w-full h-full object-cover"/> : <Camera size={32} className="text-slate-400"/>}
                        <input type="file" ref={fileInputRef} hidden onChange={(e) => setPreview(URL.createObjectURL(e.target.files[0]))} />
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        <input required placeholder="Tail Number" className="p-3 bg-slate-50 rounded-xl" value={formData.tailNumber} onChange={e => setFormData({...formData, tailNumber: e.target.value.toUpperCase()})} />
                        <input required placeholder="Contributor" className="p-3 bg-slate-50 rounded-xl" value={formData.contributorName} onChange={e => setFormData({...formData, contributorName: e.target.value})} />
                    </div>
                    <select required className="w-full p-3 bg-slate-50 rounded-xl" value={formData.aircraftId} onChange={handleAircraftChange}>
                        <option value="">Select Aircraft...</option>
                        {metadata.aircraft.map(ac => <option key={ac.id} value={ac.id}>{ac.name}</option>)}
                    </select>
                    <select required className="w-full p-3 bg-slate-50 rounded-xl" value={formData.liveryName} onChange={e => setFormData({...formData, liveryName: e.target.value})}>
                        <option value="">Select Livery...</option>
                        {specificLiveries.map(l => <option key={l.id} value={l.name}>{l.name}</option>)}
                    </select>
                    <button type="submit" className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl">{loading ? 'Saving...' : 'Submit'}</button>
                </form>
              </div>
            </div>
          );
        }
        
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
