<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroGallery</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0"
      }
    }
    </script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          Plane, 
          Upload, 
          Search, 
          X, 
          Info, 
          Camera, 
          User, 
          Tag, 
          Hash, 
          Trash2,
          AlertCircle,
          CheckCircle2,
          Loader2
        } from 'lucide-react';

        /**
         * CONFIGURATION
         * Smart API URL:
         * - If running on Localhost, use http://localhost:5000
         * - If running on Northflank (production), use the relative path '' (same domain)
         */
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
          ? 'http://localhost:5000/api/aircraft'
          : '/api/aircraft';

        // --- DEMO DATA (Used if backend is unreachable) ---
        const DEMO_DATA = [
          {
            _id: '1',
            contributorName: 'Captain Dave',
            aircraftType: 'Boeing 737-800',
            liveryName: 'SkyBlue Airlines',
            tailNumber: 'N737SB',
            imageUrl: 'https://images.unsplash.com/photo-1540962351504-03099e0a754b?auto=format&fit=crop&q=80&w=1000',
            uploadedAt: new Date().toISOString()
          },
          {
            _id: '2',
            contributorName: 'Sarah Aviator',
            aircraftType: 'Airbus A320neo',
            liveryName: 'EcoGreen',
            tailNumber: 'G-ECOG',
            imageUrl: 'https://images.unsplash.com/photo-1559087867-ce4c91325525?auto=format&fit=crop&q=80&w=1000',
            uploadedAt: new Date(Date.now() - 86400000).toISOString()
          },
          {
            _id: '3',
            contributorName: 'Mike Spotter',
            aircraftType: 'Cessna 172',
            liveryName: 'Private Owner',
            tailNumber: 'N172SP',
            imageUrl: 'https://images.unsplash.com/photo-1557800636-894a64c1696f?auto=format&fit=crop&q=80&w=1000',
            uploadedAt: new Date(Date.now() - 172800000).toISOString()
          }
        ];

        function App() {
          const [aircrafts, setAircrafts] = useState([]);
          const [loading, setLoading] = useState(true);
          const [isDemoMode, setIsDemoMode] = useState(false);
          const [showUploadModal, setShowUploadModal] = useState(false);
          const [selectedAircraft, setSelectedAircraft] = useState(null);
          const [searchTerm, setSearchTerm] = useState('');
          
          // Fetch Data on Load
          useEffect(() => {
            fetchAircraft();
          }, []);

          const fetchAircraft = async () => {
            setLoading(true);
            try {
              const response = await fetch(API_URL);
              if (!response.ok) throw new Error('Failed to connect');
              const data = await response.json();
              setAircrafts(data);
              setIsDemoMode(false);
            } catch (error) {
              console.warn("Backend unreachable, switching to Demo Mode.");
              setAircrafts(DEMO_DATA);
              setIsDemoMode(true);
            } finally {
              setLoading(false);
            }
          };

          const handleDelete = async (id, e) => {
            e.stopPropagation(); // Prevent opening the modal
            if (!confirm('Are you sure you want to delete this aircraft?')) return;

            if (isDemoMode) {
              setAircrafts(prev => prev.filter(a => a._id !== id));
              if (selectedAircraft && selectedAircraft._id === id) setSelectedAircraft(null);
              return;
            }

            try {
              await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
              fetchAircraft(); // Refresh list
              if (selectedAircraft && selectedAircraft._id === id) setSelectedAircraft(null);
            } catch (error) {
              alert('Error deleting aircraft');
            }
          };

          const filteredAircraft = aircrafts.filter(ac => 
            ac.tailNumber.toLowerCase().includes(searchTerm.toLowerCase()) ||
            ac.aircraftType.toLowerCase().includes(searchTerm.toLowerCase()) ||
            ac.liveryName.toLowerCase().includes(searchTerm.toLowerCase())
          );

          return (
            <div className="min-h-screen bg-slate-50 text-slate-900 font-sans">
              {/* --- HEADER --- */}
              <header className="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="bg-blue-600 p-2 rounded-lg text-white">
                      <Plane size={24} fill="currentColor" />
                    </div>
                    <div>
                      <h1 className="text-xl font-bold text-slate-900 tracking-tight">AeroGallery</h1>
                      <p className="text-xs text-slate-500 font-medium">Community Aircraft Database</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-4">
                    {/* Search Bar (Hidden on small mobile) */}
                    <div className="hidden md:flex items-center bg-slate-100 rounded-full px-4 py-2 border border-slate-200 focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
                      <Search size={18} className="text-slate-400" />
                      <input 
                        type="text"
                        placeholder="Search tail number or type..."
                        className="bg-transparent border-none outline-none text-sm ml-2 w-64 placeholder:text-slate-400"
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                      />
                    </div>

                    <button 
                      onClick={() => setShowUploadModal(true)}
                      className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2 shadow-lg shadow-blue-600/20 transition-all active:scale-95"
                    >
                      <Upload size={18} />
                      <span className="hidden sm:inline">Add Aircraft</span>
                    </button>
                  </div>
                </div>
              </header>

              {/* --- STATUS BAR (If Offline) --- */}
              {isDemoMode && (
                <div className="bg-amber-50 border-b border-amber-200 px-4 py-2 text-center text-xs font-medium text-amber-800 flex items-center justify-center gap-2">
                  <AlertCircle size={14} />
                  Backend not detected. Showing demo data. Ensure server.js is running on port 5000.
                </div>
              )}

              {/* --- MAIN CONTENT --- */}
              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                {loading ? (
                  <div className="flex flex-col items-center justify-center h-64 text-slate-400">
                    <Loader2 className="animate-spin mb-2" size={32} />
                    <p>Loading fleet...</p>
                  </div>
                ) : filteredAircraft.length === 0 ? (
                  <div className="text-center py-20 bg-white rounded-2xl border border-dashed border-slate-300">
                    <Plane size={48} className="mx-auto text-slate-300 mb-4" />
                    <h3 className="text-lg font-medium text-slate-900">No aircraft found</h3>
                    <p className="text-slate-500 mb-6">Be the first to spot and upload one!</p>
                    <button 
                      onClick={() => setShowUploadModal(true)}
                      className="text-blue-600 font-semibold hover:underline"
                    >
                      Upload Photo
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    {filteredAircraft.map((aircraft) => (
                      <AircraftCard 
                        key={aircraft._id} 
                        data={aircraft} 
                        onClick={() => setSelectedAircraft(aircraft)}
                        onDelete={handleDelete}
                      />
                    ))}
                  </div>
                )}
              </main>

              {/* --- MODALS --- */}
              {showUploadModal && (
                <UploadModal 
                  onClose={() => setShowUploadModal(false)} 
                  onSuccess={() => {
                    setShowUploadModal(false);
                    fetchAircraft();
                  }}
                  isDemoMode={isDemoMode}
                />
              )}

              {selectedAircraft && (
                <DetailsModal 
                  aircraft={selectedAircraft} 
                  onClose={() => setSelectedAircraft(null)} 
                />
              )}
            </div>
          );
        }

        // --- COMPONENTS ---

        function AircraftCard({ data, onClick, onDelete }) {
          return (
            <div 
              onClick={onClick}
              className="group bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-xl hover:-translate-y-1 transition-all duration-300 cursor-pointer relative"
            >
              {/* Image Aspect Ratio Wrapper */}
              <div className="relative aspect-[4/3] bg-slate-100 overflow-hidden">
                <img 
                  src={data.imageUrl} 
                  alt={data.tailNumber}
                  className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                  onError={(e) => { e.target.src = 'https://via.placeholder.com/400x300?text=No+Image'; }}
                />
                <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                  <p className="text-white text-sm font-medium flex items-center gap-1">
                    <Info size={14} /> View Details
                  </p>
                </div>
                
                {/* Tail Number Badge */}
                <div className="absolute top-3 right-3 bg-white/90 backdrop-blur-sm px-2 py-1 rounded-md text-xs font-bold shadow-sm border border-white/50 text-slate-800">
                  {data.tailNumber}
                </div>
              </div>

              {/* Card Body */}
              <div className="p-4">
                <h3 className="font-bold text-slate-900 truncate" title={data.aircraftType}>
                  {data.aircraftType}
                </h3>
                <p className="text-sm text-slate-500 mb-3 truncate">{data.liveryName}</p>
                
                <div className="flex items-center justify-between pt-3 border-t border-slate-100">
                  <div className="flex items-center gap-2 text-xs text-slate-500">
                    <div className="w-5 h-5 rounded-full bg-slate-200 flex items-center justify-center">
                       <User size={10} />
                    </div>
                    <span className="truncate max-w-[80px]">{data.contributorName}</span>
                  </div>
                  
                  <button 
                    onClick={(e) => onDelete(data._id, e)}
                    className="text-slate-300 hover:text-red-500 transition-colors p-1"
                    title="Delete Aircraft"
                  >
                    <Trash2 size={16} />
                  </button>
                </div>
              </div>
            </div>
          );
        }

        function DetailsModal({ aircraft, onClose }) {
          if (!aircraft) return null;

          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-hidden shadow-2xl flex flex-col md:flex-row relative animate-in zoom-in-95 duration-200">
                
                {/* Close Button */}
                <button 
                  onClick={onClose}
                  className="absolute top-4 right-4 z-10 p-2 bg-black/20 hover:bg-black/40 text-white rounded-full backdrop-blur-md transition-all"
                >
                  <X size={20} />
                </button>

                {/* Left: Image */}
                <div className="w-full md:w-3/5 bg-black flex items-center justify-center relative">
                   <img 
                    src={aircraft.imageUrl} 
                    alt={aircraft.tailNumber}
                    className="w-full h-full object-contain max-h-[50vh] md:max-h-full"
                   />
                </div>

                {/* Right: Info */}
                <div className="w-full md:w-2/5 p-8 flex flex-col bg-white overflow-y-auto">
                  <div className="mb-6">
                     <div className="inline-block px-3 py-1 rounded-full bg-blue-100 text-blue-700 text-xs font-bold uppercase tracking-wider mb-2">
                       Aircraft Profile
                     </div>
                     <h2 className="text-3xl font-bold text-slate-900">{aircraft.tailNumber}</h2>
                     <p className="text-lg text-slate-500">{aircraft.aircraftType}</p>
                  </div>

                  <div className="space-y-6 flex-1">
                    <InfoRow icon={<Camera />} label="Livery" value={aircraft.liveryName} />
                    <InfoRow icon={<User />} label="Spotted By" value={aircraft.contributorName} />
                    <InfoRow icon={<Tag />} label="Aircraft Type" value={aircraft.aircraftType} />
                    <InfoRow 
                      icon={<Hash />} 
                      label="Uploaded" 
                      value={new Date(aircraft.uploadedAt).toLocaleDateString(undefined, {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                      })} 
                    />
                  </div>

                  <div className="mt-8 pt-6 border-t border-slate-100 text-center">
                    <p className="text-xs text-slate-400 italic">
                      Part of the Community Aircraft Database
                    </p>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        function InfoRow({ icon, label, value }) {
          return (
            <div className="flex items-start gap-4">
              <div className="p-2 bg-slate-50 rounded-lg text-slate-400">
                {React.cloneElement(icon, { size: 20 })}
              </div>
              <div>
                <p className="text-xs font-semibold text-slate-400 uppercase tracking-wide">{label}</p>
                <p className="text-base font-medium text-slate-900">{value}</p>
              </div>
            </div>
          );
        }

        function UploadModal({ onClose, onSuccess, isDemoMode }) {
          const [loading, setLoading] = useState(false);
          const fileInputRef = useRef(null);
          const [preview, setPreview] = useState(null);
          const [formData, setFormData] = useState({
            contributorName: '',
            aircraftType: '',
            liveryName: '',
            tailNumber: ''
          });

          const handleChange = (e) => {
            setFormData({ ...formData, [e.target.name]: e.target.value });
          };

          const handleFileChange = (e) => {
            const file = e.target.files[0];
            if (file) {
              setPreview(URL.createObjectURL(file));
            }
          };

          const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);

            if (isDemoMode) {
              // Simulate upload delay
              setTimeout(() => {
                alert("Demo Mode: Aircraft 'uploaded' locally (refresh will clear it).");
                onSuccess();
              }, 1500);
              return;
            }

            try {
              // 1. Construct FormData
              const data = new FormData();
              data.append('contributorName', formData.contributorName);
              data.append('aircraftType', formData.aircraftType);
              data.append('liveryName', formData.liveryName);
              data.append('tailNumber', formData.tailNumber);
              
              if (fileInputRef.current?.files[0]) {
                data.append('image', fileInputRef.current.files[0]);
              } else {
                alert('Please select an image');
                setLoading(false);
                return;
              }

              // 2. Send to server
              const response = await fetch(API_URL, {
                method: 'POST',
                body: data, 
              });

              if (!response.ok) {
                const err = await response.json();
                throw new Error(err.message || 'Upload failed');
              }

              onSuccess();
            } catch (error) {
              console.error(error);
              alert('Upload failed: ' + error.message);
            } finally {
              setLoading(false);
            }
          };

          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white rounded-2xl w-full max-w-lg shadow-xl overflow-hidden animate-in zoom-in-95">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                  <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <Upload size={20} className="text-blue-600"/> Upload Aircraft
                  </h2>
                  <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                    <X size={20} />
                  </button>
                </div>

                <form onSubmit={handleSubmit} className="p-6 space-y-4">
                  
                  {/* File Upload Area */}
                  <div className="relative group">
                    <input 
                      type="file" 
                      ref={fileInputRef}
                      accept="image/*"
                      onChange={handleFileChange}
                      className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                    />
                    <div className={`border-2 border-dashed rounded-xl h-48 flex flex-col items-center justify-center transition-colors ${preview ? 'border-blue-500 bg-slate-50' : 'border-slate-300 hover:border-blue-400 hover:bg-slate-50'}`}>
                      {preview ? (
                        <img src={preview} alt="Preview" className="h-full w-full object-contain rounded-lg p-2" />
                      ) : (
                        <>
                          <Camera size={32} className="text-slate-300 mb-2 group-hover:text-blue-400 transition-colors" />
                          <p className="text-sm font-medium text-slate-500 group-hover:text-blue-600">Click to select photo</p>
                          <p className="text-xs text-slate-400 mt-1">JPG, PNG up to 5MB</p>
                        </>
                      )}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div className="space-y-1">
                      <label className="text-xs font-semibold text-slate-500 uppercase">Tail Number</label>
                      <input 
                        required
                        name="tailNumber"
                        placeholder="e.g. N12345"
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all uppercase"
                        value={formData.tailNumber}
                        onChange={handleChange}
                      />
                    </div>
                    <div className="space-y-1">
                      <label className="text-xs font-semibold text-slate-500 uppercase">Contributor</label>
                      <input 
                        required
                        name="contributorName"
                        placeholder="Your Name"
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                        value={formData.contributorName}
                        onChange={handleChange}
                      />
                    </div>
                  </div>

                  <div className="space-y-1">
                    <label className="text-xs font-semibold text-slate-500 uppercase">Aircraft Type</label>
                    <input 
                      required
                      name="aircraftType"
                      placeholder="e.g. Boeing 737-800"
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                      value={formData.aircraftType}
                      onChange={handleChange}
                    />
                  </div>

                  <div className="space-y-1">
                    <label className="text-xs font-semibold text-slate-500 uppercase">Livery Name</label>
                    <input 
                      required
                      name="liveryName"
                      placeholder="e.g. Standard, Special Retro..."
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                      value={formData.liveryName}
                      onChange={handleChange}
                    />
                  </div>

                  <button 
                    type="submit" 
                    disabled={loading}
                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-blue-600/20 active:scale-[0.98] disabled:opacity-70 disabled:cursor-not-allowed flex justify-center items-center gap-2 mt-4"
                  >
                    {loading ? <Loader2 className="animate-spin" size={20}/> : <CheckCircle2 size={20}/>}
                    {loading ? 'Uploading...' : 'Submit Contribution'}
                  </button>
                </form>
              </div>
            </div>
          );
        }

        // --- RENDER APP ---
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
